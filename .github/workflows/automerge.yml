# Merges the engine's own PRs (lock updates, product bumps) once the CI run started for them passes.
name: automerge
on:
  workflow_run:
    workflows: [ci, product]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ryan-morris/ffmpeg-builder/.github/workflows/automerge.yml@main
