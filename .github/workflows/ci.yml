# Pull requests: build what changed, publish nothing.
name: ci
on:
  pull_request:
  workflow_dispatch:

# write although nothing is published: GitHub won't start a run whose called workflow has a job asking for more
permissions:
  contents: write

jobs:
  build:
    uses: ryan-morris/ffmpeg-builder/.github/workflows/build.yml@main
    with:
      publish: never
      engine: github:ryan-morris/ffmpeg-builder#main
