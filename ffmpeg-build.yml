# An open-source distributor: publishes LGPL and GPL builds of FFmpeg as public GitHub releases.
bases:
  small: { with: [dav1d, opus] }
targets:
  linux-x64-lgplv3: { platform: linux-x64, license: lgplv3, ffmpeg: 9, base: [small] }
  linux-x64-gplv3:  { platform: linux-x64, license: gplv3,  ffmpeg: 9, base: [small], with: [x264] }
  win-x64-lgplv3:   { platform: win-x64,   license: lgplv3, ffmpeg: 9, base: [small] }
